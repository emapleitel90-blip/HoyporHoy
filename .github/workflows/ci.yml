name: HoyporHoy - Validación beta

on:
  push:
    branches: [main, develop, 'develop/**', 'codex/**']
  pull_request:
    branches: [main, develop, 'develop/**', 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Identificar candidato
        run: git show --no-patch --format=fuller HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Instalar servidor
        run: npm ci
        working-directory: server
      - name: Instalar cliente
        run: npm ci
        working-directory: client
      - name: Revisar código del cliente
        run: npm run lint
        working-directory: client
      - name: Probar servidor
        run: npm test
        working-directory: server
      - name: Probar cliente
        run: npm test
        working-directory: client
      - name: Compilar cliente
        run: npm run build
        working-directory: client

  audit-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ${{ matrix.project }}
      - run: npm audit --audit-level=high
        working-directory: ${{ matrix.project }}
